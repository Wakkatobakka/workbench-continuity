<title>Workbench Continuity</title>
<style>

dding:6px 10px;font-size:.75rem;font-weight:600;background:#183943;color:var(--cyan)}.tag.warn{background:#403020;color:var(--warn)}.tag.bad{background:#442b32;color:var(--red)}.tag.quiet{background:#1c2d38;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:22px}.sidebar{align-self:start;position:sticky;top:20px}.card{background:linear-gradient(145deg,#122532,#10212d);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}.sidebar .card{padding:19px}.eyebrow{font-size:.71rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:13px}.projectname{font-size:1.15rem;font-weight:700;line-height:1.4;word-break:break-word}.projectid{font: .72rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);word-break:break-all;margin-top:6px}.meta{display:grid;gap:12px;margin:20px 0 0}.meta div{display:flex;justify-content:space-between;gap:10px;font-size:.82rem}.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:600;text-align:right}.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;background:transparent;border-color:transparent;font-weight:500;display:flex;justify-content:space-between;align-items:center}.nav button.active{background:#183541;border-color:#315663;color:var(--cyan)}.nav .count{font-size:.75rem;color:var(--muted)}.sidebar-note{font-size:.76rem;line-height:1.6;margin:17px 7px;color:var(--muted)}.welcome{padding:48px 38px;position:relative;overflow:hidden}.welcome h2{font-size:2.5rem;line-height:1.1;max-width:650px;margin-bottom:20px}.welcome p{max-width:610px;color:var(--muted);font-size:1.02rem}.welcome .actions{margin:28px 0 20px}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.how div{padding:19px;background:#0b1b27;border:1px solid var(--line);border-radius:13px}.how .number{color:var(--cyan);font-size:.78rem;margin-bottom:12px;font-weight:700}.how p{font-size:.88rem;color:var(--muted);margin:0}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.heading h2{margin-bottom:8px}.heading p{font-size:.88rem;color:var(--muted);margin-bottom:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin-bottom:0}.field{margin-bottom:20px}.field:last-child{margin-bottom:0}.help{font-size:.77rem;color:var(--muted);line-height:1.55;margin:7px 0 0}.state-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.save-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px}.changes{color:var(--warn);font-size:.78rem}.receipt{white-space:pre-wrap;word-break:break-word;font:.77rem/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcd1dc;margin:0;background:#091a25;border:1px solid var(--line);border-radius:10px;padding:15px;max-height:280px;overflow:auto}.notice{padding:15px 18px;border:1px solid #3b626b;border-radius:11px;background:#132f3a;margin-bottom:18px;font-size:.86rem;line-height:1.6}.notice.warn{border-color:#745a34;background:#30281e;color:#ffdfad}.notice.bad{border-color:#714349;background:#352129;color:#ffd0d0}.notice strong{font-weight:700}.file-layout{display:grid;grid-template-columns:minmax(210px,.7fr) minmax(0,1.3fr);gap:18px}.file-list{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:#0c1b26}.file-item{border:0;border-bottom:1px solid #233a49;border-radius:0;background:transparent;display:flex;align-items:center;width:100%;text-align:left;gap:10px;padding:12px;font-weight:400}.file-item:last-child{border-bottom:0}.file-item.active{background:#183541;color:var(--cyan)}.file-item .name{font-size:.82rem;overflow-wrap:anywhere;flex:1}.file-item .size{font-size:.66rem;color:var(--muted);flex-shrink:0}.file-preview{min-width:0}.file-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;min-height:280px;max-height:560px;overflow:auto;font:.75rem/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#071721;border:1px solid var(--line);padding:17px;border-radius:11px;margin:15px 0 0}.file-path{font:.78rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;margin:0}.hash{font:.68rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;margin-top:9px}.file-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.file-toolbar select{width:auto;max-width:180px}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:.9rem}.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.state-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.state-summary .card{padding:18px;margin:0}.state-summary .value{font-size:1.1rem;font-weight:600;margin:9px 0 0;overflow-wrap:anywhere}.state-summary .help{margin:5px 0 0}.footer{margin:22px 0 0;font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.message{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);width:540px;background:#214450;border:1px solid #56868f;border-radius:13px;padding:16px 18px;box-shadow:0 8px 35px #0007;font-size:.86rem;line-height:1.5}.message.error{background:#402832;border-color:#a7626c}.message button{min-height:28px;padding:2px 9px;float:right;background:transparent;border:0;margin-left:10px}.busy{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#06101bd6;backdrop-filter:blur(4px)}.busy-box{max-width:calc(100vw - 40px);padding:28px 32px;border:1px solid var(--line);background:var(--panel);border-radius:15px;text-align:center}.spinner{width:28px;height:28px;border:3px solid #294952;border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.intake-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.screenreader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}details summary{cursor:pointer;min-height:44px;font-size:.86rem;display:flex;align-items:center;color:var(--muted)}details .receipt{margin-top:7px}.sample-info{font-size:.74rem;color:var(--muted)}
.no-project #export-private,.no-project #add-top,.no-project #export-public{display:none}.continue-card textarea#edit-next{min-height:90px}.continue-card #prepare-destination{flex:1;min-width:200px}.verification-details{margin:8px 0 20px}.verification-details summary{padding:0 15px}.continue-card #destination-details .receipt{max-height:150px}.dragging:after{content:"Drop files to carry them with your project";position:fixed;inset:12px;z-index:40;pointer-events:none;display:grid;place-items:center;background:#0a242ddf;border:3px dashed var(--cyan);border-radius:20px;padding:25px;text-align:center;font-size:1.5rem;font-weight:650}.drop-zone{border-style:dashed}#work-details>summary{margin-bottom:0}#work-details[open]>summary{margin-bottom:18px}
@media(max-width:980px){.app{padding:22px}.layout{grid-template-columns:215px minmax(0,1fr);gap:16px}.card{padding:20px}.welcome{padding:34px 25px}.welcome h2{font-size:2.1rem}.grid,.file-layout{grid-template-columns:1fr}.file-list{max-height:300px}.how{grid-template-columns:1fr}.how div{padding:16px}.how .number{margin-bottom:7px}.state-summary{grid-template-columns:1fr 1fr}.state-summary .card:last-child{grid-column:1/-1}}
@media(max-width:700px){.app{padding:17px 14px 30px}.top{align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}.top .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.top .actions button:first-child{grid-column:1/-1}.brandmark{width:38px;height:38px}.layout{display:block}.sidebar{position:static}.sidebar .card{padding:16px}.sidebar .card:not(.multiple-projects){display:none}.sidebar>button{display:none}.sidebar .projectid,.sidebar .meta{display:none}.projectname{font-size:1.03rem}.sidebar .meta{grid-template-columns:1fr 1fr;margin-top:14px;gap:10px}.sidebar .meta div{display:block}.sidebar .meta dd{text-align:left;margin-top:3px}.nav{flex-direction:row;margin-bottom:18px;gap:4px}.nav button{flex:1;text-align:center;display:flex;justify-content:center;gap:7px;font-size:.82rem;padding:10px 6px}.sidebar-note{display:none}.welcome{padding:28px 21px}.welcome h2{font-size:2rem}.welcome .actions{flex-direction:column}.welcome .actions button{width:100%}.card{padding:20px 17px}.heading{flex-direction:column;gap:8px;margin-bottom:18px}.grid{gap:14px}.state-fields,.intake-fields{grid-template-columns:1fr}.state-summary{gap:10px}.state-summary .card{padding:15px}.state-summary .value{font-size:1rem}.save-row{align-items:stretch;flex-direction:column}.save-row button{width:100%}.footer{flex-direction:column;gap:7px}.file-toolbar{flex-wrap:wrap}.file-toolbar input{width:100%}.file-toolbar select{width:100%;max-width:none}.file-preview pre{max-height:450px;min-height:200px}.file-layout{gap:17px}}

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brandmark" aria-hidden="true">↗</div><div><h1>Workbench Continuity</h1><small>Giving all chats hands · v1.2.0</small></div></div>
    <div class="actions" id="top-actions"><button class="primary" id="export-private" disabled>Save work packet</button><button id="add-top" disabled>Add files</button><button id="import-top">Open project</button><button id="load-runtime">Load build runtime</button><button class="subtle" id="download-setup">First-time setup</button><button id="sign-returned-top">Sign returned APK</button><button class="subtle" id="export-public" disabled>Public copy</button></div>
  </header>
  <div id="content"></div>
  <footer class="footer"><span>Offline · source and records stay on this device</span><span id="storage-status">Checking local save…</span></footer>
</div>
<input type="file" id="zip-input" multiple class="hidden" aria-label="Open project files"><input type="file" id="add-input" multiple class="hidden" aria-label="Add files to current project">
<input type="file" id="folder-input" webkitdirectory multiple class="hidden" aria-label="Open project folder">
<div id="live-status" class="screenreader" role="status" aria-live="polite"></div>
<div id="message" class="message hidden" role="status"></div>
<div id="busy" class="busy hidden" role="status" aria-live="polite"><div class="busy-box"><div class="spinner" aria-hidden="true"></div><div id="busy-label">Opening your project…</div></div></div>
<input type="file" id="runtime-input" accept=".zip,application/zip" class="hidden">
<!-- BUNDLE_SCRIPTS -->

</html>
